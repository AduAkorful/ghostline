[package]
name = "ghostline-paywall"
description = "HTTP 402 paywall and agent payer for Ghostline vouchers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ghostline-core = { path = "../../crates/ghostline-core" }
ghostline-policy = { path = "../../crates/ghostline-policy" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_crypto = "0.24.0"
tari_template_lib = "0.34.0"

[dev-dependencies]
ootle_byte_type = { version = "0.16", features = ["crypto"] }
tari_ootle_common_types = "0.45.0"
