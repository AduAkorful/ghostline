[package]
name = "ghostline-cli"
description = "Sign and verify Ghostline vouchers from the terminal"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "ghostline"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ghostline-core = { path = "../ghostline-core" }
ghostline-net = { path = "../ghostline-net" }
ghostline-paywall = { path = "../../middleware/ghostline-paywall" }
ghostline-policy = { path = "../ghostline-policy" }
ghostline-sdk = { path = "../ghostline-sdk" }
rand = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_crypto = "0.24.0"
tari_template_lib = "0.34.0"
tari_utilities = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ootle_byte_type = { version = "0.16", features = ["crypto"] }
rand = "0.10.1"
tari_ootle_common_types = "0.45.0"
