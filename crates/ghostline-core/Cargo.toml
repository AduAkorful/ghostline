[package]
name = "ghostline-core"
description = "Voucher and channel-identity primitives shared by the Ghostline contract tests and SDKs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
blake2 = "0.10"
ootle-network = "0.2.0"
ootle_byte_type = { version = "0.18", features = ["crypto"] }
rand = "0.10.1"
tari_bor = { version = "0.16.6", default-features = true }
tari_crypto = "0.24.0"
tari_ootle_common_types = "0.49.0"
tari_ootle_wallet_crypto = { version = "0.50", features = ["serde"] }
tari_template_lib = "0.37.0"

[dev-dependencies]
ootle_byte_type = { version = "0.18", features = ["crypto"] }
proptest = "1"
serde_json = "1"
tari_ootle_common_types = "0.49.0"
tari_utilities = "0.10"
