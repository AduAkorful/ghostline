[package]
name = "ghostline-sdk"
description = "Open, settle and refund Ghostline stealth channels"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# Exposes the pooled-settlement feasibility prototype. The builder receives every
# participant's deposit opening in one process and is not coordinator-private.
trusted-local-batch-prototype = []

[dependencies]
ghostline-core = { path = "../ghostline-core" }
ootle-network = "0.2.0"
ootle_byte_type = { version = "0.16", features = ["crypto"] }
rand = "0.10.1"
tari_bor = { version = "0.16.3", default-features = true }
tari_crypto = "0.24.0"
tari_engine_types = "0.45.0"
tari_ootle_transaction = { version = "0.45.0", features = ["serde"] }
tari_ootle_wallet_crypto = { version = "0.46", features = ["serde"] }
tari_template_lib = "0.34.0"
tari_utilities = "0.10"

[dev-dependencies]
tari_ootle_common_types = "0.45.0"
