[package]
name = "ghostline-contract-tests"
description = "Engine-level tests for the Ghostline channel contract"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]

[dev-dependencies]
ghostline-core = { path = "../ghostline-core" }
ghostline-sdk = { path = "../ghostline-sdk", features = ["trusted-local-batch-prototype", "adversarial-test-builders"] }
ootle_byte_type = { version = "=0.21.0", features = ["crypto"] }
ootle-network = "=0.2.0"
rand = "0.10.1"
tari_bor = { version = "=0.17.2", default-features = true }
tari_crypto = "0.24.0"
tari_engine = "=0.53.3"
tari_engine_types = "=0.53.3"
tari_ootle_common_types = "=0.53.3"
tari_ootle_transaction = "=0.53.3"
tari_ootle_wallet_crypto = { version = "=0.54.0", features = ["serde"] }
tari_template_lib = "=0.40.1"
tari_template_test_tooling = "=0.53.3"
tari_utilities = "=0.10.0"
