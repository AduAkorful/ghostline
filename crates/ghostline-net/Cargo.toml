[package]
name = "ghostline-net"
description = "Submit Ghostline transactions to an Ootle indexer or a local wallet daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
ghostline-core = { path = "../ghostline-core" }
ghostline-sdk = { path = "../ghostline-sdk" }
ootle-network = "0.2.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_ootle_transaction = { version = "=0.53.3", features = ["serde"] }
tari_crypto = "0.24.0"
tari_template_lib = "=0.40.1"
tari_utilities = "0.10"
thiserror = "2"
url = "2"

[dev-dependencies]
ootle_byte_type = { version = "=0.21.0", features = ["crypto"] }
rand = "0.10.1"
tari_ootle_common_types = "=0.53.3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
