[package]
name = "ghostline-paid-api"
description = "Reference paid HTTP API protected by a Ghostline paywall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ghostline-paid-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.5", features = ["derive"] }
ghostline-core = { path = "../../crates/ghostline-core" }
ghostline-paywall = { path = "../../middleware/ghostline-paywall" }
ghostline-policy = { path = "../../crates/ghostline-policy" }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
tari_crypto = "0.24.0"
tari_template_lib = "0.34.0"
tari_utilities = "0.10"
tokio = { version = "1.53", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
ghostline-policy = { path = "../../crates/ghostline-policy" }
http-body-util = "0.1"
ootle_byte_type = { version = "0.16", features = ["crypto"] }
serde_json = "1"
tari_crypto = "0.24.0"
tari_ootle_common_types = "0.45.0"
tari_template_lib = "0.34.0"
tower = { version = "0.5.3", features = ["util"] }
