[package]
name = "ghostline-paid-api"
description = "Reference paid HTTP API protected by a Ghostline paywall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[[bin]]
name = "ghostline-paid-api"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
chacha20poly1305 = "0.10.1"
clap = { version = "4.5", features = ["derive"] }
ghostline-core = { path = "../../crates/ghostline-core" }
ghostline-net = { path = "../../crates/ghostline-net" }
ghostline-paywall = { path = "../../middleware/ghostline-paywall" }
ghostline-policy = { path = "../../crates/ghostline-policy" }
ghostline-sdk = { path = "../../crates/ghostline-sdk" }
getrandom = "0.4.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tari_crypto = "0.24.0"
tari_ootle_wallet_crypto = "0.46.0"
tari_template_lib = "0.34.0"
tari_utilities = "0.10"
tokio = { version = "1.53", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6.11", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
ghostline-policy = { path = "../../crates/ghostline-policy" }
http-body-util = "0.1"
ootle_byte_type = { version = "0.16", features = ["crypto"] }
serde_json = "1"
tari_crypto = "0.24.0"
tari_ootle_common_types = "0.45.0"
tari_template_lib = "0.34.0"
tower = { version = "0.5.3", features = ["util"] }
