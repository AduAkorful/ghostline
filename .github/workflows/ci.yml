name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: |
            . -> target
            contracts/channel -> target
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/ghostline/package-lock.json
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev protobuf-compiler
      - name: Run Rust workspace tests
        run: cargo test --workspace
      - name: Build the Ghostline channel template for Ootle
        run: cargo build --manifest-path contracts/channel/Cargo.toml --target wasm32-unknown-unknown --release
      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run TypeScript tests
        run: npm ci --prefix packages/ghostline && npm run build:browser --prefix packages/ghostline && npm test --prefix packages/ghostline
      - name: Run site tests
        run: node --test demo/ui/mock-wallet.test.mjs demo/ui/site.test.mjs
      - name: Execute the local quickstart smoke test
        run: bash scripts/quickstart-smoke.sh
      - name: Exercise the prebuilt-demo command without wallet configuration
        run: cargo run --locked --quiet -p ghostline-cli -- demo --calls 3 --show-chain-evidence
      - name: Verify installer checksum, clean install, and demo command
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p ghostline-cli -p ghostline-mcp -p ghostline-paid-api
          fixture="$RUNNER_TEMP/ghostline-install-fixture"
          mock_bin="$RUNNER_TEMP/ghostline-mock-bin"
          install_dir="$RUNNER_TEMP/ghostline-installed-bin"
          mkdir -p "$fixture/package" "$mock_bin"
          for executable in ghostline ghostline-mcp ghostline-paid-api; do
            install -m 0755 "target/debug/$executable" "$fixture/package/$executable"
            strip --strip-debug "$fixture/package/$executable"
          done
          install -m 0644 LICENSE README.md "$fixture/package/"
          archive=ghostline-x86_64-unknown-linux-gnu.tar.gz
          tar -C "$fixture/package" -czf "$fixture/$archive" ghostline ghostline-mcp ghostline-paid-api LICENSE README.md
          (cd "$fixture" && sha256sum "$archive" > SHA256SUMS)
          cat > "$mock_bin/curl" <<'MOCK_CURL'
          #!/bin/sh
          set -eu
          url=
          output=
          while [ "$#" -gt 0 ]; do
            case "$1" in
              -o) output=$2; shift 2 ;;
              http://*|https://*) url=$1; shift ;;
              *) shift ;;
            esac
          done
          [ -n "$url" ] && [ -n "$output" ]
          cp "$GHOSTLINE_INSTALL_FIXTURE/${url##*/}" "$output"
          MOCK_CURL
          chmod 0755 "$mock_bin/curl"
          docker run --rm --network none \
            -v "$fixture:/fixture:ro" \
            -v "$mock_bin:/mock:ro" \
            -v "$GITHUB_WORKSPACE:/repo:ro" \
            ubuntu:24.04 bash -ec '
              export HOME=/tmp/ghostline-clean-home
              export GHOSTLINE_INSTALL_DIR=/tmp/ghostline-bin
              export GHOSTLINE_INSTALL_FIXTURE=/fixture
              export TMPDIR=/tmp/ghostline-demo-tmp
              export PATH=/mock:$PATH
              mkdir -p "$TMPDIR"
              sh /repo/scripts/install-ghostline.sh
              PATH="$GHOSTLINE_INSTALL_DIR:$PATH" timeout 10s ghostline demo --calls 3
              test -z "$(find "$TMPDIR" -mindepth 1 -print -quit)"
            '
      - name: Check the interactive Esmeralda runner syntax
        run: bash -n scripts/ghostline-esmeralda-demo.sh

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.ref }}
      - uses: dtolnay/rust-toolchain@1.97.1
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libclang-dev protobuf-compiler
      - name: Check that the tag matches the CLI version
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version=1 | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "ghostline-cli"))')"
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match ghostline-cli version v$version" >&2
            exit 1
          fi
      - name: Build release executables
        run: cargo build --locked --release -p ghostline-cli -p ghostline-mcp -p ghostline-paid-api
      - name: Package Linux x86-64 archive and checksum
        shell: bash
        run: |
          package_root="$RUNNER_TEMP/ghostline-package"
          mkdir -p "$package_root"
          install -m 0755 target/release/ghostline "$package_root/ghostline"
          install -m 0755 target/release/ghostline-mcp "$package_root/ghostline-mcp"
          install -m 0755 target/release/ghostline-paid-api "$package_root/ghostline-paid-api"
          install -m 0644 LICENSE "$package_root/LICENSE"
          install -m 0644 README.md "$package_root/README.md"
          archive="ghostline-x86_64-unknown-linux-gnu.tar.gz"
          tar -C "$package_root" -czf "$RUNNER_TEMP/$archive" ghostline ghostline-mcp ghostline-paid-api LICENSE README.md
          cd "$RUNNER_TEMP"
          sha256sum "$archive" > SHA256SUMS
      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v3.0.3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            ${{ runner.temp }}/ghostline-x86_64-unknown-linux-gnu.tar.gz
            ${{ runner.temp }}/SHA256SUMS
